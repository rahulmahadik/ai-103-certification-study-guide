name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time. A run already in progress is left to finish
# rather than cancelled, so a half-published site is never live.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vendor fonts and icons
        run: npm run assets

      - name: Build the study guide pages
        run: npm run guide

      - name: Assemble the cheat sheet board
        run: npm run cheatsheet

      # This step fails if the cheat sheet content has outgrown its fixed
      # board, which is the point — better a red build than a cropped poster.
      - name: Render the cheat sheet
        run: npm run render

      - name: Build sitemap, robots and the social card
        run: npm run seo

      # Fails on a dead fragment, a directory link, a nav link pointing at the
      # wrong page, or an external link that does not open in a new tab.
      - name: Check links
        run: npm run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
